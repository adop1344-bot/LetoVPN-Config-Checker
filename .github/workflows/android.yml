name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/letovpn.keystore.b64 > keystore/letovpn.keystore
          ls -la keystore/

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/letovpn.keystore
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LetoVPN-Checker
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: LetoVPN Checker v1.6.1
          body: |
            ## LetoVPN Config Checker v1.6.1

            **Подписанный APK** — можно ставить поверх предыдущих версий 1.6.1+ без удаления.

            ### Changelog 1.6 / 1.6.1

            #### Добавлено
            - Постоянная подпись приложения (обновления без удаления)
            - Включение/выключение источников (включая системный)
            - Метод **Максимум (Xray Speed)** — загрузка ~100 KB через туннель
            - Опция «Стоп после N рабочих»
            - Фильтр «Только VLESS»
            - Экспорт: TXT / base64-подписка / топ-10
            - Автосохранение настроек

            #### Методы проверки
            - Неточная (TCP)
            - Средняя (TCP+DNS)
            - Точная (Via Proxy GET)
            - Суперточная (Deep)
            - Xray (ядро)
            - Максимум (Xray Speed)

            Telegram: [@letovpn_free](https://t.me/letovpn_free)
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
