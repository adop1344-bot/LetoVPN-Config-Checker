plugins {
    id 'com.android.application'
}

android {
    namespace 'com.letovpn.checker'
    compileSdk 34

    defaultConfig {
        applicationId "com.letovpn.checker"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.6.1"
    }

    signingConfigs {
        release {
            storeFile file("${System.getenv('KEYSTORE_PATH') ?: '../keystore/letovpn.keystore'}")
            storePassword "letovpn_checker_2026"
            keyAlias "letovpn"
            keyPassword "letovpn_checker_2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // та же подпись — обновления без удаления
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
